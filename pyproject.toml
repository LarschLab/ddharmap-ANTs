[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeants-2pf-hcr"
version = "0.1.0"
description = "Extracted package for the 2PF to HCR staged notebook pipeline."
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "nbclient",
  "nbformat",
  "pandas",
  "scipy",
  "scikit-image",
  "SimpleITK",
  "tifffile",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
